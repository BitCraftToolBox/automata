name: Extract BitCraft assets
on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'

jobs:
  steam-auth:
    runs-on: self-hosted
    env:
      HOME: /tmp/depotdownloader-home
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Download DepotDownloader
        run: |
          mkdir -p /tmp/depotdownloader-bin
          wget -qO /tmp/DepotDownloader.zip https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-linux-x64.zip
          unzip -o /tmp/DepotDownloader.zip -d /tmp/depotdownloader-bin DepotDownloader
          chmod +x /tmp/depotdownloader-bin/DepotDownloader
      - name: Steam auth cache
        id: auth-cache
        uses: actions/cache@v4
        with:
          path: /tmp/depotdownloader-home/.local/share/IsolatedStorage
          key: steamauth
      - name: Steam auth
        if: steps.auth-cache.outputs.cache-hit != 'true'
        run: |
          /tmp/depotdownloader-bin/DepotDownloader -app 3454650 -qr -remember-password -os windows -branch preview -manifest-only
      - uses: actions/cache/save@v5
        if: steps.auth-cache.outputs.cache-hit != 'true'
        id: save-auth-cache
        with:
          path: /tmp/depotdownloader-home/.local/share/IsolatedStorage
          key: steamauth

  extract-assets:
    needs: steam-auth
    runs-on: ubuntu-latest
    env:
      HOME: /tmp/depotdownloader-home
    steps:
      - uses: actions/checkout@v4
      - name: Download DepotDownloader
        run: |
          mkdir -p /tmp/depotdownloader-bin
          wget -qO /tmp/DepotDownloader.zip https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-linux-x64.zip
          unzip -o /tmp/DepotDownloader.zip -d /tmp/depotdownloader-bin DepotDownloader
          chmod +x /tmp/depotdownloader-bin/DepotDownloader
      - name: Restore Steam auth cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/depotdownloader-home/.local/share/IsolatedStorage
          key: steamauth
          fail-on-cache-miss: true

      # --- Step 1: Check client manifest; if new, download and extract immediately ---

      - name: Create workspace directory
        run: mkdir -p workspace/assets
      - name: Check depot manifest
        working-directory: workspace/assets
        env:
          STEAM_USER: ${{ secrets.STEAM_USER }}
        run: |
          /tmp/depotdownloader-bin/DepotDownloader -app 3454650 -username $STEAM_USER -remember-password -os windows -branch preview -manifest-only \
          | grep Manifest | cut -d " " -f 2 > manifest.txt
      - name: Cache depot manifest
        id: manifest-cache
        uses: actions/cache@v4
        with:
          path: workspace/assets/manifest.txt
          key: manifest-${{ hashFiles('workspace/assets/manifest.txt') }}

      - name: Extract and catalog assets
        if: steps.manifest-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/extract-and-catalog
        with:
          steam-user: ${{ secrets.STEAM_USER }}
          actions-token: ${{ secrets.ACTIONS_TOKEN }}

      # --- Step 2: Check game data; build path list and cache on its hash ---

      - name: Checkout game data repo
        uses: actions/checkout@v4
        with:
          repository: BitCraftToolBox/BitCraft_GameData
          ref: cereal/cs
          path: workspace/assets/game-data
      - name: Build game data path list
        working-directory: workspace/assets
        run: |
          cp ../../scripts/assets/wanted_sprites.json .
          cp ../../scripts/assets/wanted_prefabs.json .
          chmod +x ../../scripts/assets/build_gamedata_paths.sh
          ../../scripts/assets/build_gamedata_paths.sh
      - name: Cache game data paths
        id: gamedata-paths-cache
        uses: actions/cache@v4
        with:
          path: |
            workspace/assets/gamedata_paths_sprites.json
            workspace/assets/gamedata_paths_prefabs.json
          key: gamedata-paths-${{ hashFiles('workspace/assets/gamedata_paths_sprites.json', 'workspace/assets/gamedata_paths_prefabs.json') }}

      # --- Step 3: If game data paths changed but client manifest did not, extract the client now ---

      - name: Extract and catalog assets (game data changed, same client)
        if: steps.gamedata-paths-cache.outputs.cache-hit != 'true' && steps.manifest-cache.outputs.cache-hit == 'true'
        uses: ./.github/actions/extract-and-catalog
        with:
          steam-user: ${{ secrets.STEAM_USER }}
          actions-token: ${{ secrets.ACTIONS_TOKEN }}

      # --- Step 3.5: If either client manifest or game data paths changed, save lists to artifacts

      - name: Save catalog and game data paths to artifacts
        if: steps.manifest-cache.outputs.cache-hit != 'true' || steps.gamedata-paths-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: asset-extraction-metadata
          path: |
            workspace/assets/sprites.json
            workspace/assets/gamedata_paths_sprites.json
            workspace/assets/gamedata_paths_prefabs.json
            workspace/assets/extracted_pngs.txt

      # --- Step 4: Build asset map and convert ---

      - name: Map and convert assets
        if: steps.manifest-cache.outputs.cache-hit != 'true' || steps.gamedata-paths-cache.outputs.cache-hit != 'true'
        working-directory: workspace/assets
        run: |
          chmod +x ../../scripts/assets/map_and_convert_assets.sh
          ../../scripts/assets/map_and_convert_assets.sh
      - name: Commit and push assets
        if: steps.manifest-cache.outputs.cache-hit != 'true' || steps.gamedata-paths-cache.outputs.cache-hit != 'true'
        working-directory: workspace/assets/publish
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update assets: $(date +%Y-%m-%d)"
            git push origin
          fi

      # --- Step 5: Publish prefab models to the BitCraft_Models submodule repo ---

      - name: Checkout prefab models repo
        if: steps.manifest-cache.outputs.cache-hit != 'true' || steps.gamedata-paths-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: BitCraftToolBox/BitCraft_Models
          path: workspace/assets/models
          token: ${{ secrets.ACTIONS_TOKEN }}

      - name: Install asset script dependencies
        if: steps.manifest-cache.outputs.cache-hit != 'true' || steps.gamedata-paths-cache.outputs.cache-hit != 'true'
        working-directory: scripts/assets
        run: npm ci

      - name: Publish prefabs
        if: steps.manifest-cache.outputs.cache-hit != 'true' || steps.gamedata-paths-cache.outputs.cache-hit != 'true'
        working-directory: workspace/assets
        run: npm exec tsx ../../scripts/assets/publish_prefabs.ts

      - name: Commit and push prefab models
        if: steps.manifest-cache.outputs.cache-hit != 'true' || steps.gamedata-paths-cache.outputs.cache-hit != 'true'
        id: push-models
        working-directory: workspace/assets/models
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update prefabs: $(date +%Y-%m-%d)"
            git push origin
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump prefabs submodule
        if: steps.push-models.outputs.pushed == 'true'
        working-directory: workspace/assets/publish
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C prefabs fetch origin
          git -C prefabs checkout "$(git -C ../models rev-parse HEAD)"
          git add prefabs
          if ! git diff --cached --quiet; then
            git commit -m "Update prefabs submodule: $(date +%Y-%m-%d)"
            git push origin
          fi