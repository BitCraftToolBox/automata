name: Update SpacetimeDB Bindings
on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'

jobs:
  generate-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch schemas
        run: scripts/generate-bindings/get-schema.sh
        env:
          BITCRAFT_SPACETIME_HOST: ${{ secrets.BITCRAFT_SPACETIME_HOST }}
          BITCRAFT_GLOBAL_MODULE: ${{ secrets.BITCRAFT_GLOBAL_MODULE }}
          BITCRAFT_REGION_MODULE: ${{ secrets.BITCRAFT_REGION_MODULE }}
          DATA_DIR: ${{ github.workspace }}/workspace/bindings
      - name: Check schema changes
        id: check-cache
        uses: actions/cache@v4
        with:
          path: |
            workspace/bindings/global_schema.json
            workspace/bindings/region_schema.json
            workspace/bindings/global_schema_v10.json
            workspace/bindings/region_schema_v10.json
          key: schemas-${{ hashFiles('workspace/bindings/global_schema.json', 'workspace/bindings/region_schema.json', 'workspace/bindings/global_schema_v10.json', 'workspace/bindings/region_schema_v10.json') }}
      - uses: actions/checkout@v4
        if: steps.check-cache.outputs.cache-hit != 'true'
        with:
          repository: BitCraftToolBox/BitCraft_GameData
          path: workspace/bindings/schema
          ref: schema
          token: ${{ secrets.ACTIONS_TOKEN }}
      - if: steps.check-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          cd workspace/bindings/schema
          jq . ../global_schema.json > global_schema.json
          jq . ../region_schema.json > region_schema.json
          jq . ../global_schema_v10.json > global_schema_v10.json
          jq . ../region_schema_v10.json > region_schema_v10.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update schema: $(date +%Y-%m-%d)"
            git push origin schema
          fi
      - uses: actions/checkout@v4
        if: steps.check-cache.outputs.cache-hit != 'true'
        with:
          repository: BitCraftToolBox/BitCraft_Bindings
          path: workspace/bindings/bindings-repo
          token: ${{ secrets.ACTIONS_TOKEN }}
      - name: Generate bindings
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://install.spacetimedb.com | sh -s -- --yes
          spacetime version install 1.12.0
          spacetime version install 1.3.0
          spacetime version install 2.10.0
          scripts/generate-bindings/make-bindings.sh
        env:
          DATA_DIR: ${{ github.workspace }}/workspace/bindings
      - name: Update bindings for BSATN/Cereal scripts
        if: steps.check-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git submodule update --init --recursive --remote -f scripts/bsatn/bindings scripts/cereal-cs/bindings
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update bindings"
            git push origin
          fi